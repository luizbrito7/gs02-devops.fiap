# Jenkins Configuration as Code: tudo que antes era feito pela UI.
# ${VARS} vêm do infra/.env (fora do Git).
jenkins:
  systemMessage: "GS02 DevSecOps: configurado via JCasC"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy: loggedInUsersCanDoAnything

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: sonar-token
              secret: "${SONAR_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: dockerhub
              username: "${DOCKERHUB_USER}"
              password: "${DOCKERHUB_TOKEN}"

unclassified:
  location:
    url: "${JENKINS_URL}"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: sonarqube
        serverUrl: http://sonarqube:9000
        credentialsId: sonar-token

jobs:
  - script: >
      pipelineJob('queimadas-api') {
        properties { pipelineTriggers { triggers { githubPush() } } }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/luizbrito7/gs02-devops.fiap.git') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
